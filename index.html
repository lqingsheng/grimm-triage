<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="doc.title">Grimm Triage: Night Shift at St. Grimm's ER</title>
  <meta name="description" content="Learn real emergency triage (ESI v4 logic) by sorting monster patients. Educational demo only. Not a medical device." />
  <meta name="theme-color" content="#0b0a10" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip.main">Skip to main content</a>
  <div class="fog" aria-hidden="true"></div>
  <header>
    <div class="lang-toggle" role="group" aria-label="Language" data-i18n-aria="lang.label">
      <button type="button" data-lang="en" lang="en" aria-pressed="true">English</button>
      <button type="button" data-lang="zh-CN" lang="zh-CN" aria-pressed="false">中文</button>
    </div>
    <h1><span aria-hidden="true">🕯️</span> <span class="h1-title" data-i18n="header.title">St. Grimm's ER</span> <span class="h1-sub" data-i18n="header.subtitle">Night Shift</span></h1>
    <p class="tag" data-i18n="header.tag">Learn real emergency triage by sorting monsters. The costume is fake. The logic is real.</p>
    <nav aria-label="Mode" data-i18n-aria="nav.label">
      <button type="button" data-mode="game" class="active" aria-pressed="true" aria-controls="game" data-i18n="nav.game">Night Shift (game)</button>
      <button type="button" data-mode="calc" aria-pressed="false" aria-controls="calc" data-i18n="nav.calc">Triage Desk (calculator)</button>
    </nav>
  </header>

  <main id="main" tabindex="-1">
    <section id="game" class="panel" aria-label="Night Shift game" data-i18n-aria="section.game">
      <div class="drips" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <div class="hud"><span id="caseNo"></span><span id="score">Score 0</span></div>
      <div id="play">
        <article class="card" id="caseCard" tabindex="-1" aria-labelledby="caseNo caseName"></article>
        <div class="levels" id="levelButtons" role="group" aria-label="Choose a triage level" data-i18n-aria="level.group"></div>
        <div id="feedback" class="feedback" role="status" aria-live="polite" aria-label="Triage feedback" data-i18n-aria="feedback.label"></div>
        <button type="button" id="nextCase" class="ghost" hidden data-i18n="game.next">Next patient ☠️</button>
      </div>
      <div id="shiftReport" class="report" role="region" aria-labelledby="reportTitle" hidden></div>
    </section>

    <section id="calc" class="panel" aria-label="Triage Desk calculator" data-i18n-aria="section.calc" hidden>
      <form id="calcForm" class="grid" aria-label="Patient findings" data-i18n-aria="calc.form">
        <label><span data-i18n="calc.age">Age (years)</span><input name="ageYears" type="number" value="45" required></label>
        <label><span data-i18n="calc.avpu">AVPU</span>
          <select name="avpu"><option value="A" data-i18n="calc.avpu.A">A</option><option value="V" data-i18n="calc.avpu.V">V</option><option value="P" data-i18n="calc.avpu.P">P</option><option value="U" data-i18n="calc.avpu.U">U</option></select>
        </label>
        <label><span data-i18n="calc.hr">HR (/min)</span><input name="hr" type="number" value="90" required></label>
        <label><span data-i18n="calc.rr">RR (/min)</span><input name="rr" type="number" value="16" required></label>
        <label><span data-i18n="calc.sbp">SBP (mmHg)</span><input name="sbp" type="number" value="125" required></label>
        <label><span data-i18n="calc.spo2">SpO₂ (%)</span><input name="spo2" type="number" value="98" min="0" max="100" required></label>
        <label><span data-i18n="calc.temp">Temp (°C)</span><input name="tempC" type="number" step="0.1" value="36.8" required></label>
        <label><span data-i18n="calc.pain">Pain (0–10)</span><input name="pain" type="number" value="2" min="0" max="10" required></label>
        <label><span data-i18n="calc.resources">Expected resources</span><input name="resources" type="number" value="1" min="0" required></label>
        <label class="chk"><input name="newConfusion" type="checkbox"> <span data-i18n="calc.newConfusion">New confusion / lethargy</span></label>
        <label class="chk"><input name="highRisk" type="checkbox"> <span data-i18n="calc.highRisk">High-risk complaint</span></label>
        <label class="chk"><input name="needsLifesaving" type="checkbox"> <span data-i18n="calc.needsLifesaving">Needs life-saving intervention now</span></label>
        <button type="submit" data-i18n="calc.submit">Summon triage level 🔮</button>
      </form>
      <div id="calcResult" class="feedback" role="status" aria-live="polite" aria-label="Triage result" data-i18n-aria="calc.result"></div>
    </section>
  </main>

  <footer>
    <span data-i18n="footer.disclaimer">Educational demo only. Not a medical device. Never use for real patient care.</span>
    <span data-i18n="footer.basis">Based on the logic of the Emergency Severity Index (ESI) v4.</span>
  </footer>
  <script type="module" src="src/app.js"></script>
  <script>
    // Offline support (PWA): sw.js precaches the app. Relative path, so it works at any deploy root.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => console.warn('Offline mode unavailable:', err));
      });
    }
  </script>
</body>
</html>
